# caddy (HTTPS) -> web (FastAPI, read-only) ; worker (the only LLM caller, 1 replica) ; db ; backup
x-app: &app
  build: .
  image: brand-tracker
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://tracker:${POSTGRES_PASSWORD}@db:5432/tracker
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      retries: 20
    restart: unless-stopped   # no published port: only reachable inside this network

  migrate:
    <<: *app
    command: sh -c "alembic upgrade head && python -m app.cli seed"
    depends_on: {db: {condition: service_healthy}}
    restart: "no"

  web:
    <<: *app
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s

  worker:
    <<: *app
    command: python -m app.worker
    depends_on: {migrate: {condition: service_completed_successfully}}
    deploy: {replicas: 1}   # never scale: one batch runner (the advisory lock is the backstop)

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: tracker
      PGDATABASE: tracker
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./ops/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
