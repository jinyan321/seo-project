[project]
name = "brand-mention-tracker"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: needs a Postgres database (set TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers and our frozen Filters dataclass are safe as defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "app.scoring.Filters"]
