{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<h2>Users</h2>
<div class="card">
  <table>
    <tr><th>Username</th><th>Role</th><th>Created</th></tr>
    {% for u in users %}
    <tr><td>{{ u.username }}</td><td>{{ "admin" if u.is_admin else "user" }}</td>
        <td class="muted">{{ u.created_at.strftime('%Y-%m-%d') }}</td></tr>
    {% endfor %}
  </table>
</div>
<div class="card">
  <h3>Add a user</h3>
  <form method="post" action="/admin/users">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><input name="username" placeholder="Username" required>
       <input name="password" type="password" placeholder="Password (8+ characters)" minlength="8" required>
       <label><input type="checkbox" name="is_admin" value="true"> Admin</label></p>
    <button type="submit">Create</button>
  </form>
</div>
{% endblock %}
