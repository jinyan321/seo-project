<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Brand Tracker{% endblock %}</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e2dd;
          --accent:#2f6f5e; --bad:#b3261e;
          --own:#1f7a4d; --own-bg:#dff3e7; --comp:#b25e09; --comp-bg:#fdebd3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#1f1f1d; --ink:#ecebe6; --muted:#a3a29c; --line:#34332f;
            --accent:#6fbfa6; --bad:#f2b8b5;
            --own:#7fd6a6; --own-bg:#173d2a; --comp:#f0a860; --comp-bg:#40290f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:16px; align-items:center; padding:12px 16px;
           border-bottom:1px solid var(--line); background:var(--card); flex-wrap:wrap; }
  header strong { margin-right:auto; }
  header a { color:var(--ink); text-decoration:none; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:16px; margin-bottom:16px; overflow-x:auto; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; }
  .tile .v { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); font-size:13px; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  input, textarea, select, button { font:inherit; padding:6px 8px; border:1px solid var(--line);
          border-radius:6px; background:var(--bg); color:var(--ink); }
  textarea { width:100%; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  button.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .flash { padding:8px 12px; border-radius:6px; margin-bottom:16px; border:1px solid var(--line); }
  .flash.err { color:var(--bad); }
  .stopped { color:var(--muted); }
  form.inline { display:inline; }
</style>
</head>
<body>
{% if user %}
<header>
  <strong>AI Brand Tracker</strong>
  <a href="/dashboard">Dashboard</a>
  <a href="/answers">AI Answers</a>
  <a href="/admin/prompts">Prompts</a>
  {% if user.is_admin %}<a href="/admin/users">Users</a>{% endif %}
  <form class="inline" method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="secondary" type="submit">Log out ({{ user.username }})</button>
  </form>
</header>
{% endif %}
<main>
  {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
  {% if err %}<div class="flash err">{{ err }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
